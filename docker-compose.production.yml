services:
  nginx:
    container_name: white-label-stock-api-nginx
    build:
      context: .docker/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    tty: true
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    environment:
      TZ: "${APP_TIMEZONE:-UTC}"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./.docker/nginx/conf.d/api.conf:/etc/nginx/conf.d/api.conf
      - /etc/letsencrypt/:/etc/letsencrypt/
    networks:
      - white-label-stock-api-network
    depends_on:
      - php-fpm

  php-fpm:
    container_name: white-label-stock-api-php
    build:
      context: .docker/php
      dockerfile: Dockerfile
    restart: unless-stopped
    tty: true
    environment:
      TZ: "${APP_TIMEZONE:-UTC}"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}"
    volumes:
      - .:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - white-label-stock-api-network
    depends_on:
      pgsql:
        condition: service_healthy

  pgsql:
    container_name: white-label-stock-api-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: "${APP_TIMEZONE:-UTC}"
    volumes:
      - white-label-stock-api-postgres-data:/var/lib/postgresql/data
    networks:
      - white-label-stock-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  white-label-stock-api-network:
    name: white-label-stock-api-network
    driver: bridge

volumes:
  white-label-stock-api-postgres-data:
    name: white-label-stock-api-postgres-data
